name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  go:
    name: go build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache-dependency-path: backend/go.sum

      - name: Build
        working-directory: backend
        run: go build ./...

      - name: Vet
        working-directory: backend
        run: go vet ./...

      # -count=1 defeats the test cache so a green run means the tests actually
      # executed on this commit, not that a cached result was replayed.
      - name: Test
        working-directory: backend
        run: go test ./... -count=1

  contracts:
    name: hardhat test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - run: npx hardhat compile

      - run: npx hardhat test
